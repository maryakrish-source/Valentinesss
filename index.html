<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: #ffd6e7;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

.card {
  background: #fffaf5;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  width: 320px;
  position: relative;
}

.teddy {
  font-size: 70px;
  margin-bottom: 10px;
}

h1 {
  font-weight: 600;
  font-size: 22px;
  color: #333;
  margin-bottom: 20px;
}

.buttons { position: relative; }

button {
  padding: 10px 22px;
  border: none;
  border-radius: 20px;
  margin: 8px;
  font-size: 15px;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
}

#yes { background: #ff4f7b; color: white; }
#no { background: #eee; position: absolute; }

.shy { font-size: 12px; color: #666; margin-top: 10px; }
.message { margin-top: 15px; font-size: 18px; color: #ff2e74; font-weight: 600; }
</style>
</head>

<body>

<div class="card">
  <div class="teddy">🧸</div>
  <h1>Will you be my valentine?</h1>

  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <p class="shy">"No" seems a bit shy 🙈</p>
  <div class="message" id="msg"></div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("msg");

let moveCount = 0;
const maxMoves = 8;

function moveButton() {
  if (moveCount >= maxMoves) return;
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.position = "fixed";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  moveCount++;
}

noBtn.addEventListener("mouseenter", moveButton);
noBtn.addEventListener("click", moveButton);

yesBtn.addEventListener("click", () => {
  msg.innerHTML = "YAYYY 💕 You just made my whole year special 😭💖";

  for (let i = 0; i < 30; i++) {
    const heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.style.position = "fixed";
    heart.style.left = window.innerWidth / 2 + "px";
    heart.style.top = window.innerHeight / 2 + "px";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    heart.style.pointerEvents = "none";
    heart.style.transition = "all 1s ease-out";
    document.body.appendChild(heart);

    const angle = Math.random() * 2 * Math.PI;
    const distance = Math.random() * 200 + 100;

    setTimeout(() => {
      heart.style.left = window.innerWidth / 2 + Math.cos(angle) * distance + "px";
      heart.style.top = window.innerHeight / 2 + Math.sin(angle) * distance + "px";
      heart.style.opacity = "0";
    }, 10);

    setTimeout(() => heart.remove(), 1000);
  }
});
</script>

</body>
</html>
